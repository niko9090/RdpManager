# Server di sincronizzazione RdpManager, per il Synology (DSM 7.1, docker-compose 1.28).
# Prima di avviare: copia .env.example in .env e metti una RDPM_SYNC_ADMIN_KEY lunga e casuale.
#
# Rete: il server condivide la rete del contenitore "wireguard" (network_mode), quindi ascolta
# anche su 10.66.0.1 (interfaccia wg0): i client VPN lo raggiungono su http://10.66.0.1:8787.
# Non pubblica porte da solo: la porta 8787 e' pubblicata dal contenitore wireguard e SOLO su
# 127.0.0.1 dell'host (vedi ../wireguard-synology/docker-compose.yml). Mai su LAN o Internet.
# Il contenitore wireguard deve essere attivo prima di questo; se wireguard viene ricreato
# (docker-compose up) va ricreato anche questo: "docker-compose up -d --force-recreate".
services:
  rdpm-sync:
    build: .
    image: rdpm-sync:1.1.0
    container_name: rdpm-sync
    restart: unless-stopped
    network_mode: "container:wireguard"
    environment:
      RDPM_SYNC_ADMIN_KEY: ${RDPM_SYNC_ADMIN_KEY:-}
      RDPM_SYNC_PORT: ${RDPM_SYNC_PORT:-8787}
      RDPM_SYNC_TOKEN_DAYS: ${RDPM_SYNC_TOKEN_DAYS:-30}
      RDPM_SYNC_MAX_DOC_MB: ${RDPM_SYNC_MAX_DOC_MB:-8}
      # Registrazione dall'app e VPN automatica (vedi LEGGIMI.md)
      RDPM_SYNC_OPEN_REGISTRATION: ${RDPM_SYNC_OPEN_REGISTRATION:-}
      RDPM_SYNC_REGISTRATION_CODE: ${RDPM_SYNC_REGISTRATION_CODE:-}
      RDPM_VPN_CONF: /vpn/wg0.conf
      RDPM_VPN_ENDPOINT: ${RDPM_VPN_ENDPOINT:-}
      RDPM_VPN_DNS: ${RDPM_VPN_DNS:-}
    # root con la sola capability DAC_OVERRIDE: wg0.conf (0600) e i profili appartengono a un altro uid (1000,
    # creati dal contenitore wireguard) e senza DAC_OVERRIDE root non li legge. Tutte le altre capability sono tolte.
    # Il socket di wireguard-go e' di root: per "wg set" basta l'uid 0.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ./data:/data
      # Config del server WireGuard (wg0.conf, server.pub): la stessa cartella del contenitore wireguard
      - ../wireguard/config:/vpn
      # Socket di wireguard-go (creato dal contenitore wireguard in ./run): serve al comando "wg set"
      - ../wireguard/run:/var/run/wireguard
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
