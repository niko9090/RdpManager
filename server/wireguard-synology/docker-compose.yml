# Server WireGuard per RdpManager (rete 10.66.0.0/24, porta 51820/UDP).
# Su DSM 7.1 il kernel (4.4) non ha il modulo WireGuard: l'immagine costruita dal
# Dockerfile accanto a questo file aggiunge wireguard-go (userspace) e iptables-legacy.
# Compatibile con docker-compose 1.28 (pacchetto Docker di DSM 7.1).
services:
  wireguard:
    build: .
    image: rdpmanager/wireguard-go:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      # wg0.conf, chiavi e script stanno qui (la cartella accanto a questo file)
      - ./config:/config/wg_confs
      - ./scripts:/scripts:ro
      # Socket di wireguard-go, condiviso con rdpm-sync (che aggiunge i PC da solo con "wg set")
      - ./run:/var/run/wireguard
    ports:
      - 51820:51820/udp
      # Server di sincronizzazione (rdpm-sync usa la rete di questo contenitore): solo localhost dell'host
      - 127.0.0.1:8787:8787
    restart: unless-stopped
